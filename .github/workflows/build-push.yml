name: Build and push

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shejera
          POSTGRES_USER: shejera
          POSTGRES_PASSWORD: shejera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shejera -d shejera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch tag
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -z "${latest}" ]; then
            next="v0.1.0"
          else
            ver="${latest#v}"
            major=${ver%%.*}
            rest=${ver#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Tagging and publishing ${next} (previous: ${latest:-none})"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon \
            -Pjooq.url=jdbc:postgresql://localhost:5432/shejera \
            -Pjooq.user=shejera \
            -Pjooq.password=shejera

      - name: Build fat jar
        run: |
          chmod +x gradlew
          ./gradlew buildFatJar --no-daemon \
            -Pjooq.url=jdbc:postgresql://localhost:5432/shejera \
            -Pjooq.user=shejera \
            -Pjooq.password=shejera
          mkdir -p dist
          cp build/libs/*-all.jar dist/app.jar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}-staging

      - name: Create and push git tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"

      - name: Verify image in GHCR
        if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          image="ghcr.io/${{ github.repository }}:${tag}"
          token=$(curl -fsSL -u "${{ github.actor }}:${GHCR_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${{ github.repository }}:pull" \
            | jq -r .token)
          curl -fsSIL -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/${tag}" >/dev/null
          echo "Verified ${image}"

      - name: Bump image pin in homelab
        if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
        env:
          HOMELAB_DEPLOY_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${HOMELAB_DEPLOY_TOKEN:-}" ]; then
            echo "HOMELAB_DEPLOY_TOKEN secret is not set; skipping homelab pin bump"
            exit 1
          fi
          file="kubernetes/apps/shejera/deployment.yaml"
          image="ghcr.io/okarahan/shejera-backend:${TAG}"
          work=$(mktemp -d)
          trap 'rm -rf "${work}"' EXIT
          git clone --depth 20 \
            "https://x-access-token:${HOMELAB_DEPLOY_TOKEN}@github.com/okarahan/homelab.git" \
            "${work}/homelab"
          cd "${work}/homelab"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if grep -q "image: ${image}" "${file}"; then
            echo "Homelab already pinned to ${image}; nothing to do"
            exit 0
          fi
          sed -i -E "s|image: ghcr.io/okarahan/shejera-backend:[^[:space:]]+|image: ${image}|" "${file}"
          if ! grep -q "image: ${image}" "${file}"; then
            echo "Failed to bump image pin in ${file}" >&2
            exit 1
          fi
          git add "${file}"
          git commit -m "chore(shejera): bump backend to ${TAG}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing..."
            git pull --rebase origin main
          done
          echo "Failed to push homelab pin after retries" >&2
          exit 1
