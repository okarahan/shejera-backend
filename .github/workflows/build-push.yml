name: Build and push

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push next patch tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -z "${latest}" ]; then
            next="v0.1.0"
          else
            ver="${latest#v}"
            major=${ver%%.*}
            rest=${ver#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Tagging ${next} (previous: ${latest:-none})"
          git tag -a "${next}" -m "Release ${next}"
          git push origin "refs/tags/${next}"

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shejera
          POSTGRES_USER: shejera
          POSTGRES_PASSWORD: shejera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shejera -d shejera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build fat jar
        run: |
          chmod +x gradlew
          ./gradlew buildFatJar --no-daemon \
            -Pjooq.url=jdbc:postgresql://localhost:5432/shejera \
            -Pjooq.user=shejera \
            -Pjooq.password=shejera
          mkdir -p dist
          cp build/libs/*-all.jar dist/app.jar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
