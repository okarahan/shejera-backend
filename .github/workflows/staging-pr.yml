name: Staging PR deploy

# Builds images tagged *-staging only. Prod images (v0.1.x) are built on merge to main
# via build-push.yml — never from this workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  HOMELAB_STAGING_FILE: kubernetes/apps/shejera-staging/deployment.yaml
  IMAGE_REPO: ghcr.io/okarahan/shejera-backend
  STAGING_SUFFIX: -staging

jobs:
  deploy-staging:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shejera
          POSTGRES_USER: shejera
          POSTGRES_PASSWORD: shejera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shejera -d shejera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build fat jar
        run: |
          chmod +x gradlew
          ./gradlew buildFatJar --no-daemon \
            -Pjooq.url=jdbc:postgresql://localhost:5432/shejera \
            -Pjooq.user=shejera \
            -Pjooq.password=shejera
          mkdir -p dist
          cp build/libs/*-all.jar dist/app.jar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}${{ env.STAGING_SUFFIX }}
            ${{ env.IMAGE_REPO }}:pr-${{ github.event.pull_request.number }}-latest${{ env.STAGING_SUFFIX }}

      - name: Bump staging pin in homelab
        env:
          HOMELAB_DEPLOY_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HOMELAB_DEPLOY_TOKEN:-}" ]; then
            echo "HOMELAB_DEPLOY_TOKEN secret is not set" >&2
            exit 1
          fi
          image="${IMAGE_REPO}:pr-${PR_NUMBER}-${SHA}${STAGING_SUFFIX}"
          work=$(mktemp -d)
          trap 'rm -rf "${work}"' EXIT
          git clone --depth 20 \
            "https://x-access-token:${HOMELAB_DEPLOY_TOKEN}@github.com/okarahan/homelab.git" \
            "${work}/homelab"
          cd "${work}/homelab"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if grep -q "image: ${image}" "${HOMELAB_STAGING_FILE}"; then
            echo "Homelab staging already pinned to ${image}"
          else
            sed -i -E "s|image: ghcr.io/okarahan/shejera-backend:[^[:space:]]+|image: ${image}|" "${HOMELAB_STAGING_FILE}"
            if ! grep -q "image: ${image}" "${HOMELAB_STAGING_FILE}"; then
              echo "Failed to bump staging pin in ${HOMELAB_STAGING_FILE}" >&2
              exit 1
            fi
            git add "${HOMELAB_STAGING_FILE}"
            git commit -m "chore(shejera-staging): bump backend PR #${PR_NUMBER}"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              echo "Push rejected (attempt ${attempt}); rebasing..."
              git pull --rebase origin main
            done
          fi

      - name: Comment staging URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          <!-- shejera-staging -->
          **Staging deploy** (backend PR #${PR_NUMBER})

          - URL: https://staging.shejera.home.okarahan.arpa
          - Image: \`${IMAGE_REPO}:pr-${PR_NUMBER}-${SHA}${STAGING_SUFFIX}\`
          - Bootstrap: https://staging.shejera.home.okarahan.arpa/contrib/staging-bootstrap
          EOF
          )
          existing=$(gh pr view "${PR_NUMBER}" --json comments --jq '.comments[] | select(.body | contains("<!-- shejera-staging -->")) | .id' | head -1 || true)
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" -f body="${body}"
          else
            gh pr comment "${PR_NUMBER}" --body "${body}"
          fi

  staging-fallback:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert or roll staging pin forward
        env:
          HOMELAB_DEPLOY_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          CLOSED_PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${HOMELAB_DEPLOY_TOKEN:-}" ]; then
            echo "HOMELAB_DEPLOY_TOKEN secret is not set" >&2
            exit 1
          fi
          work=$(mktemp -d)
          trap 'rm -rf "${work}"' EXIT
          git clone --depth 20 \
            "https://x-access-token:${HOMELAB_DEPLOY_TOKEN}@github.com/okarahan/homelab.git" \
            "${work}/homelab"
          cd "${work}/homelab"
          current=$(grep -E 'image: ghcr.io/okarahan/shejera-backend:' "${HOMELAB_STAGING_FILE}" | sed -E 's/.*image: //')
          if ! echo "${current}" | grep -q "pr-${CLOSED_PR}-.*${STAGING_SUFFIX}$"; then
            echo "Staging pin ${current} is not from closed PR #${CLOSED_PR}; nothing to do"
            exit 0
          fi
          next_pr=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json number,updatedAt --jq 'sort_by(.updatedAt) | reverse | .[0].number // empty')
          if [ -n "${next_pr}" ]; then
            image="${IMAGE_REPO}:pr-${next_pr}-latest${STAGING_SUFFIX}"
            msg="chore(shejera-staging): backend fallback to PR #${next_pr}"
          else
            latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            if [ -z "${latest}" ]; then
              echo "No release tag found for fallback" >&2
              exit 1
            fi
            image="${IMAGE_REPO}:${latest}${STAGING_SUFFIX}"
            msg="chore(shejera-staging): backend fallback to ${latest}${STAGING_SUFFIX}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E "s|image: ghcr.io/okarahan/shejera-backend:[^[:space:]]+|image: ${image}|" "${HOMELAB_STAGING_FILE}"
          git add "${HOMELAB_STAGING_FILE}"
          git commit -m "${msg}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
